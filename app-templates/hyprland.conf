# Kaleido — generated colors for Hyprland. Do not edit by hand.
# Source with: source = ~/.config/hypr/kaleido.conf

general {
    col.active_border = rgb({{ colors.primary.default.hex_stripped }}) rgb({{ colors.tertiary.default.hex_stripped }}) 45deg
    col.inactive_border = rgb({{ colors.outline_variant.default.hex_stripped }})
}

group {
    col.border_active = rgb({{ colors.primary.default.hex_stripped }})
    col.border_inactive = rgb({{ colors.outline_variant.default.hex_stripped }})
    col.border_locked_active = rgb({{ colors.error.default.hex_stripped }})
    col.border_locked_inactive = rgb({{ colors.outline_variant.default.hex_stripped }})
}

decoration {
    shadow {
        color = rgba({{ colors.shadow.default.hex_stripped }}ee)
    }
}
