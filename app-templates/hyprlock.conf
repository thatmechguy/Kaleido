# Kaleido — generated colors for Hyprlock. Do not edit by hand.
# Source with: source = ~/.config/hypr/kaleido-lock.conf

general {
    col.text = rgba({{ colors.on_surface.default.hex_stripped }}ee)
}

background {
    color = rgba({{ colors.surface.default.hex_stripped }}ee)
}

input-field {
    size = 200, 44
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.20
    outer_color = rgba({{ colors.outline.default.hex_stripped }}ff)
    inner_color = rgba({{ colors.surface_container.default.hex_stripped }}ff)
    font_color = rgba({{ colors.on_surface.default.hex_stripped }}ff)
    check_color = rgba({{ colors.primary.default.hex_stripped }}ff)
    fail_color = rgba({{ colors.error.default.hex_stripped }}ff)
    capslock_color = rgba({{ colors.tertiary.default.hex_stripped }}ff)
}
