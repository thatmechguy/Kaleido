# Kaleido — generated theme for tmux. Do not edit by hand.
# Source with: source-file ~/.config/tmux/kaleido.conf

set -g status-style "bg={{ colors.surface_container.default.hex }},fg={{ colors.on_surface.default.hex }}"
set -g status-left-style "bg={{ colors.primary.default.hex }},fg={{ colors.on_primary.default.hex }}"
set -g status-right-style "bg={{ colors.surface_container.default.hex }},fg={{ colors.on_surface_variant.default.hex }}"
set -g message-style "bg={{ colors.primary.default.hex }},fg={{ colors.on_primary.default.hex }}"
set -g pane-border-style "fg={{ colors.outline_variant.default.hex }}"
set -g pane-active-border-style "fg={{ colors.primary.default.hex }}"

setw -g window-status-style "bg={{ colors.surface_container.default.hex }},fg={{ colors.on_surface_variant.default.hex }}"
setw -g window-status-current-style "bg={{ colors.primary.default.hex }},fg={{ colors.on_primary.default.hex }}"
setw -g window-status-activity-style "bg={{ colors.surface_container.default.hex }},fg={{ colors.tertiary.default.hex }}"
setw -g window-status-bell-style "bg={{ colors.error.default.hex }},fg={{ colors.on_error.default.hex }}"
